# **PORT comes from the platform and must not be hard-coded.** Your app is one service on a
# private network and the door in front of it dials the port it was told about. The part
# after the colon is only the default for running it on your own machine.
server.port=${PORT:8080}

# Listen on every address, not only localhost, so the door in front of the app can reach it.
server.address=0.0.0.0

# **Ten megabytes is a limit somebody chose, not a rule.** The request limit is a little
# higher than the file limit because a form post is the file plus a few headers: with both
# at exactly 10MB, a file of exactly 10MB would be refused for the headers around it.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# When an upload is too big, read and throw away what is left of it instead of closing the
# connection, so the browser gets our error page rather than a "connection reset".
server.tomcat.max-swallow-size=-1

spring.main.banner-mode=off
